<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songkhla Ship Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: chart-room console — entry panel + time-ordered list on the left, a live paper proof of the printed schedule on the right */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#13212E; --muted:#5A6B7B; --line:#D3DDE5;
  --accent:#0B5C9E; --accent-ink:#FFFFFF; --focus:#3B8FD6;
  --in:#DDF6FB; --in-ink:#0B6475; --out:#FFE7CF; --out-ink:#8A4B10; --shift:#EDE6FF; --shift-ink:#55399A;
  --late:#FFD6F5; --late-ink:#9B1C7A; --warn:#FFF1C9; --warn-ink:#7A5600; --pilot:#D0021B; --ok:#E3F5E8; --ok-ink:#1F6B3A;
  --paper:#FFFFFF; --paper-ink:#000000;
  --f-ui:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-sheet:"Book Antiqua","Palatino Linotype",Palatino,"TH Sarabun New","Tahoma",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151C; --surface:#15212B; --ink:#E6EEF4; --muted:#93A5B4; --line:#2A3A47;
  --accent:#5BA8E8; --accent-ink:#06121C; --focus:#7CC0F5;
  --in:#123A44; --in-ink:#9FE3F2; --out:#45301A; --out-ink:#FFCB94; --shift:#2E2650; --shift-ink:#CDBDFF;
  --late:#4A1A3E; --late-ink:#FFB0E8; --warn:#3D3210; --warn-ink:#FFDC7A; --pilot:#FF6B6B; --ok:#173726; --ok-ink:#9BE3B4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D151C; --surface:#15212B; --ink:#E6EEF4; --muted:#93A5B4; --line:#2A3A47;
  --accent:#5BA8E8; --accent-ink:#06121C; --focus:#7CC0F5;
  --in:#123A44; --in-ink:#9FE3F2; --out:#45301A; --out-ink:#FFCB94; --shift:#2E2650; --shift-ink:#CDBDFF;
  --late:#4A1A3E; --late-ink:#FFB0E8; --warn:#3D3210; --warn-ink:#FFDC7A; --pilot:#FF6B6B; --ok:#173726; --ok-ink:#9BE3B4;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-ui);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font-weight:700;font-size:19px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;color:var(--muted);font-size:14px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav input{font-size:18px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:18px}
.window{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.mode{font-size:13px;padding:3px 8px;border-radius:99px;background:var(--warn);color:var(--warn-ink);font-weight:600;border:0;cursor:pointer}
.setup{max-width:760px;display:grid;gap:12px}.setup p{margin:0}
.mode.live{background:var(--ok);color:var(--ok-ink)}

main{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.work{display:grid;grid-template-columns:minmax(0,620px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.work{grid-template-columns:minmax(0,1fr)}.proofside{display:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{margin:0 0 12px;font-size:16px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.col{display:grid;gap:18px;min-width:0}

/* form */
form{display:grid;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:2px solid var(--line);background:var(--bg);padding:10px 4px;border-radius:9px;font-size:18px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"][data-t="IN"]{background:var(--in);color:var(--in-ink);border-color:currentColor}
.seg button[aria-pressed="true"][data-t="OUT"]{background:var(--out);color:var(--out-ink);border-color:currentColor}
.seg button[aria-pressed="true"][data-t="SHIFT"]{background:var(--shift);color:var(--shift-ink);border-color:currentColor}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:14px;color:var(--muted);font-weight:500}
.f input,.f select{width:100%;font-size:20px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center}
.f input.left{text-align:left}
.f .hint{font-size:13px;color:var(--muted);min-height:1.2em}
.f .hint.bad{color:var(--pilot)}
.span2{grid-column:span 2}.span4{grid-column:1/-1}.span3{grid-column:span 3}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.span3{grid-column:1/-1}}
.pilots{display:flex;flex-wrap:wrap;gap:6px}
.pilots button{min-width:62px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);font:600 18px var(--f-num);cursor:pointer}
.pilots button[aria-pressed="true"]{border-color:var(--pilot);color:var(--pilot);background:var(--surface)}
.pilots input{width:80px;font:600 18px var(--f-num);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center}
.check{display:flex;align-items:center;gap:8px;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);padding:10px 18px;border-radius:9px;font-weight:600;cursor:pointer;font-size:17px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1}
.btn.danger{color:var(--pilot)}
.editing{font-size:14px;background:var(--warn);color:var(--warn-ink);padding:6px 10px;border-radius:8px}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:14px;font-weight:600}
.c-in{background:var(--in);color:var(--in-ink)}.c-out{background:var(--out);color:var(--out-ink)}.c-shift{background:var(--shift);color:var(--shift-ink)}
.c-late{background:var(--late);color:var(--late-ink)}.c-warn{background:var(--warn);color:var(--warn-ink)}.c-ok{background:var(--ok);color:var(--ok-ink)}

/* list */
.list{display:grid;gap:4px}
.row{display:grid;grid-template-columns:34px 78px 54px minmax(0,1fr) 92px auto;gap:8px;align-items:center;padding:8px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.row:hover{border-color:var(--line)}
.row.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.row .no{font:600 15px var(--f-num);color:var(--muted);text-align:center}
.row .no.late{color:var(--late-ink)}
.row .t{font:600 17px var(--f-num)}
.row .ship{min-width:0}
.row .ship b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ship span{font-size:13px;color:var(--muted)}
.row select{font:600 16px var(--f-num);padding:5px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--pilot);width:100%;text-align:center}
.row select.empty{background:var(--warn);color:var(--warn-ink);border-color:var(--warn-ink)}
.row .ops{display:flex;gap:4px}
.row .ops button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 8px;font-size:14px;cursor:pointer;white-space:nowrap}
.row .ops button.confirm{background:var(--pilot);color:#fff;border-color:var(--pilot)}
.tchip{font-size:13px;font-weight:700;text-align:center;border-radius:6px;padding:3px 0}
.gap{font-size:12px;color:var(--muted);text-align:center;border-top:1px dashed var(--line);margin:6px 0 2px;padding-top:2px}
.sub{font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.empty-state{padding:24px;text-align:center;color:var(--muted)}
@media (max-width:560px){.row{grid-template-columns:30px 70px minmax(0,1fr) 78px}.row .tchip{display:none}.row .ops{grid-column:2/-1}}

/* proof */
.proofwrap{overflow:hidden;border-radius:6px;border:1px solid var(--line);background:#9aa6b0}
.proofscale{transform-origin:0 0}
.paper{background:var(--paper);color:var(--paper-ink);width:1123px;padding:16px}
.printbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.note{font-size:14px;color:var(--muted)}
.scrollx{overflow-x:auto}

/* ---------- the printed sheet (kept identical to the Excel tab) ---------- */
table.sheet{border-collapse:collapse;table-layout:fixed;width:100%;font-family:var(--f-sheet);font-size:10pt;color:#000;background:#fff}
.sheet td{border:.5pt solid #555;height:18pt;padding:0 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:clip;line-height:1}
.sheet .l{text-align:left}
.sheet .b{font-weight:700}
.sheet .date{font-size:22pt;font-weight:700;background:#FFFF99}
.sheet .title{font-size:14pt;font-weight:700}
.sheet .h-in{background:#CCFFFF;font-weight:700}
.sheet .h-out{background:#FFCC99;font-weight:700}
.sheet .hd{background:#EAEAEA;font-weight:700}
.sheet .pc{color:#FF0000;font-weight:700}
.sheet .r{background:#CCFFCC;font-weight:700;font-size:7pt}
.sheet .late-h{background:#FFCCFF;font-weight:700;font-size:11pt}
.sheet .foot{background:#FFFF99;font-weight:700;white-space:pre}
.sheet .noR{border-right:0}.sheet .noT{border-top:0}
#printRoot{display:none}
#measure{position:absolute;left:-99999px;top:0;width:1091px;visibility:hidden}
@page{size:A4 landscape;margin:4.3mm}
@media print{
  body{background:#fff}
  body::before,.top,main,.toast{display:none!important}
  #printRoot{display:block}
  #printRoot table.sheet{width:100%}
}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s,border-color .15s}}
</style>
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<header class="top">
  <div class="brand">ตารางเรือ <small>SONGKHLA PILOT</small></div>
  <div class="datenav">
    <button class="iconbtn" id="prevDay" aria-label="วันก่อนหน้า">‹</button>
    <input type="date" id="schedDate" aria-label="ตารางวันที่">
    <button class="iconbtn" id="nextDay" aria-label="วันถัดไป">›</button>
  </div>
  <div class="window" id="windowLabel"></div>
  <button type="button" class="mode" id="modeBadge" title="ตั้งค่าการเชื่อมต่อ"></button>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-work" aria-selected="true">จัดตาราง</button>
    <button role="tab" id="tab-print" aria-selected="false">หน้าปริ้น</button>
    <button role="tab" id="tab-line" aria-selected="false" disabled title="ขั้นที่ 3">รูป LINE</button>
  </nav>
</header>

<main>
  <section id="view-work" class="work">
    <div class="col">
      <div class="panel">
        <h2 id="formTitle">เพิ่มเรือ</h2>
        <form id="mvForm" autocomplete="off">
          <div class="seg" id="typeSeg">
            <button type="button" data-t="IN" aria-pressed="true">เข้า</button>
            <button type="button" data-t="OUT" aria-pressed="false">ออก</button>
            <button type="button" data-t="SHIFT" aria-pressed="false">ย้ายท่า</button>
          </div>
          <div class="grid">
            <div class="f span3"><label for="fShip">ชื่อเรือ</label><input id="fShip" class="left" list="dlShips" placeholder="พิมพ์ชื่อเรือ" required><div class="hint" id="hShip"></div></div>
            <div class="f"><label for="fLoa">LOA</label><input id="fLoa" class="num" inputmode="numeric"></div>
            <div class="f span2"><label for="fTime" id="lTime">ETA</label><input id="fTime" class="num" placeholder="0630 หรือ 27-0630" required><div class="hint" id="hTime"></div></div>
            <div class="f"><label for="fPob">POB</label><input id="fPob" class="num" placeholder="= ETA"></div>
            <div class="f"><label for="fDrf">Drf</label><input id="fDrf" class="num" inputmode="decimal"></div>
            <div class="f span2" id="wFrom"><label for="fFrom">ท่าที่ออก</label><input id="fFrom" list="dlBerths"></div>
            <div class="f span2" id="wTo"><label for="fTo">ท่าเข้า</label><input id="fTo" list="dlBerths"></div>
            <div class="f span2"><label for="fAgent">เอเย่นต์</label><input id="fAgent" list="dlAgents"></div>
            <div class="f span2" style="align-content:end"><label class="check"><input type="checkbox" id="fLate"> แจ้งเพิ่มหลังจัดจ่าย (พ)</label></div>
            <div class="f span4"><label>นำร่อง (ผก.)</label><div class="pilots" id="pilotBtns"></div></div>
          </div>
          <div id="editBanner" class="editing" hidden></div>
          <div class="actions">
            <button type="submit" class="btn primary" id="saveBtn">บันทึก (Enter)</button>
            <button type="button" class="btn" id="clearBtn">ล้าง</button>
            <button type="button" class="btn danger" id="delBtn" hidden>ลบ</button>
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>รายการในรอบนี้</h2>
        <div class="stats" id="stats"></div>
        <div class="list" id="list"></div>
        <div id="lateList"></div>
      </div>
    </div>
    <div class="col proofside">
      <div class="panel">
        <h2>ตัวอย่างหน้าปริ้น</h2>
        <div class="proofwrap" id="proofSmall"><div class="proofscale"><div class="paper" id="paperSmall"></div></div></div>
      </div>
    </div>
  </section>

  <section id="view-setup" hidden>
    <div class="panel setup">
      <h2>เชื่อมต่อ Google Sheet ตารางเรือ</h2>
      <p class="note">ใช้ชีต <b>ShipSchedule_DB</b> + สคริปต์ <b>apps_script/Schedule.gs</b> (คนละชีตกับบันทึกเรือ) ขั้นตอนติดตั้งอยู่ใน README หัวข้อ เมนู 🗓 จัดตารางเรือ</p>
      <form id="setupForm" class="grid" autocomplete="off">
        <div class="f span4"><label for="sUrl">Web app URL (ลงท้าย /exec)</label><input id="sUrl" class="left" placeholder="https://script.google.com/macros/s/…/exec"></div>
        <div class="f span2"><label for="sKey">รหัส (ตามบรรทัด KEYS ในสคริปต์)</label><input id="sKey" class="left"></div>
        <div class="f span2" style="align-content:end"><button type="submit" class="btn primary" id="sTest">ทดสอบและเชื่อมต่อ</button></div>
        <div class="f span4"><div class="hint" id="sMsg"></div></div>
      </form>
      <div class="actions"><button type="button" class="btn" id="sBack">กลับไปจัดตาราง</button><button type="button" class="btn danger" id="sOff">ยกเลิกการเชื่อมต่อในเครื่องนี้</button></div>
    </div>
  </section>

  <section id="view-print" hidden>
    <div class="printbar">
      <button class="btn primary" id="printBtn" style="flex:0 0 auto">ปริ้น</button>
      <span class="note" id="printNote">A4 แนวนอน · หน้าเดียว</span>
    </div>
    <div class="scrollx"><div class="paper" id="paperBig"></div></div>
  </section>
</main>

<div id="printRoot"></div><div id="measure" aria-hidden="true"></div>
<datalist id="dlShips"></datalist><datalist id="dlBerths"></datalist><datalist id="dlAgents"></datalist>
<div class="toast" id="toast" hidden></div>

<script>
/* การเชื่อมต่อ: จาก Streamlit secrets [schedule] (window.__SCHED__) หรือที่กรอกในหน้า ตั้งค่า (เก็บในเครื่องนี้) */
const CFG_KEY='shipsched_cfg';
const CFG = (()=>{ const c={API_URL:'',TOKEN:''}; const inj=window.__SCHED__||{};
  if(inj.url){ c.API_URL=inj.url; c.TOKEN=inj.key||''; }
  try{ const v=JSON.parse(localStorage.getItem(CFG_KEY)||'null'); if(v&&v.url){ c.API_URL=v.url; c.TOKEN=v.key||''; } }catch(e){}
  return c; })();
if(window.__THEME__) document.documentElement.dataset.theme = window.__THEME__;
const SEED = /*SEED*/null;

const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const COLW = [3.86,20.29,3.86,3.86,8,8,8,3.86,6.71,3.71,21.43,4.14,4.14,8.14,18,3.86,7.14,7.43]; // Excel column widths A..R
const EMAIL = 'songkhlapilot@hotmail.com';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S = { ships:[], shipIdx:new Map(), berths:[], agents:[], pilots:{}, duty:{}, fixed:[], settings:{cutoff:'17:00', gap:2},
  mv:[], D:'', type:'IN', pilot:'', editId:null, pobTouched:false, loaded:[null,null] };

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
function todayYmd(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(ymd,n){ const [y,m,d]=ymd.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,d+n)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`; }
function longDate(ymd){ const [y,m,d]=ymd.split('-').map(Number); return `${d} ${MONTHS[m-1]} ${y}`; }
function shortDate(ymd){ const [y,m,d]=ymd.split('-').map(Number); return `${d}/${m}`; }
function cutHM(){ return S.settings.cutoff.replace(':',''); }
function win(D){ return [`${D} ${S.settings.cutoff}`, `${addDays(D,1)} ${S.settings.cutoff}`]; }
function inWin(m,D){ const [a,b]=win(D); return m.datetime>=a && m.datetime<b; }
function schedOf(dt){ const d=dt.slice(0,10), hm=dt.slice(11).replace(':',''); return hm>=cutHM()? d : addDays(d,-1); }
function fmtT(dt){ if(!dt) return ''; return `${+dt.slice(8,10)}-${dt.slice(11,13)}${dt.slice(14,16)}`; }
function minutes(dt){ const [d,t]=dt.split(' '); const [y,m,dd]=d.split('-').map(Number); const [h,mi]=t.split(':').map(Number); return Date.UTC(y,m-1,dd,h,mi)/60000; }
function parseTime(txt, D){
  txt=(txt||'').trim().replace(/[.:]/g,''); let m, date, hm;
  if((m=txt.match(/^(\d{3,4})$/))){ hm=m[1].padStart(4,'0'); date = hm>=cutHM()? D : addDays(D,1); }
  else if((m=txt.match(/^(\d{1,2})\s*[-\/ ]\s*(\d{3,4})$/))){ hm=m[2].padStart(4,'0'); const day=+m[1];
    for(const off of [0,1,-1,2,-2,3]){ const c=addDays(D,off); if(+c.slice(8)===day){ date=c; break; } } }
  if(!date) return null;
  const h=+hm.slice(0,2), mi=+hm.slice(2); if(h>23||mi>59) return null;
  return `${date} ${pad(h)}:${pad(mi)}`;
}

/* ---------- data layer ---------- */
const LS_KEY='shipsched-demo-v1';
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ return null; } }
function lsSet(v){ try{ localStorage.setItem(LS_KEY, JSON.stringify(v)); }catch(e){} }
const demo = {
  db:null,
  boot(){ const saved=lsGet(); this.db = saved && saved.v===1 ? saved : {v:1, mv:SEED.movements.slice(), extraShips:[]}; },
  persist(){ lsSet(this.db); },
};
async function api(action, params={}, body=null){
  if(!CFG.API_URL){
    if(!SEED) throw new Error('ยังไม่ได้ตั้งค่า API_URL');
    if(!demo.db) demo.boot();
    if(action==='init') return {...SEED.init, ships:[...SEED.init.ships, ...demo.db.extraShips]};
    if(action==='movements') return demo.db.mv.filter(m=>m.datetime>=params.from && m.datetime<params.to);
    if(action==='saveMovement'){ const i=demo.db.mv.findIndex(x=>x.id===body.m.id); if(i>=0) demo.db.mv[i]=body.m; else demo.db.mv.push(body.m); demo.persist(); return body.m; }
    if(action==='deleteMovement'){ demo.db.mv=demo.db.mv.filter(x=>x.id!==body.id); demo.persist(); return true; }
    if(action==='saveShip'){ demo.db.extraShips.push(body.ship); demo.persist(); return body.ship; }
  }
  let r;
  if(body){ r = await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:CFG.TOKEN,action,...body})}); }
  else { r = await fetch(CFG.API_URL+'?'+new URLSearchParams({action,token:CFG.TOKEN,...params})); }
  const j = await r.json(); if(!j.ok) throw new Error(j.error||'ผิดพลาด'); return j.data;
}

async function loadInit(){
  const d = await api('init');
  S.ships = d.ships.filter(s=>s.name); S.shipIdx = new Map(S.ships.map(s=>[s.name.toUpperCase(), s]));
  S.berths = d.berths; S.agents = d.agents; S.pilots = d.pilots; S.duty = d.duty; S.fixed = d.fixed;
  S.settings = {...S.settings, ...d.settings};
  fillDatalists();
}
async function loadMovements(){
  const from=`${addDays(S.D,-14)} 00:00`, to=`${addDays(S.D,3)} 23:59`;
  S.mv = await api('movements',{from,to});
  S.loaded=[from,to];
}
function fillDatalists(){
  $('dlShips').innerHTML = S.ships.map(s=>`<option value="${esc(s.name)}">${esc([s.loa,s.berth,s.agent].filter(Boolean).join(' · '))}</option>`).join('');
  $('dlBerths').innerHTML = S.berths.map(b=>`<option value="${esc(b)}">`).join('');
  $('dlAgents').innerHTML = S.agents.map(a=>`<option value="${esc(a)}">`).join('');
}
function dutyPilots(D){ const k=D.slice(0,7); const keys=Object.keys(S.duty).sort();
  let best=null; for(const x of keys){ if(x<=k) best=x; } return (best? S.duty[best] : (keys.length? S.duty[keys[0]]:['178','189'])).filter(Boolean); }

/* ---------- layout engine (matches the Excel sheet rules) ---------- */
const order = m => m.type==='IN' ? 1 : 0;   // same minute: sailing/shifting numbered before entering
function sortMv(a,b){ return a.datetime<b.datetime?-1:a.datetime>b.datetime?1:order(a)-order(b); }
function buildMain(items){
  const list=items.slice().sort(sortMv); const rows=[{blank:true}]; const no=new Map(); let n=1, prev=null;
  const slots=[]; for(const m of list){ const s=slots[slots.length-1]; if(s && s.dt===m.datetime) s.items.push(m); else slots.push({dt:m.datetime, items:[m]}); }
  for(const s of slots){
    if(prev && (minutes(s.dt)-minutes(prev))/60 >= S.settings.gap) rows.push({blank:true, gapH:(minutes(s.dt)-minutes(prev))/60});
    const outs=s.items.filter(m=>m.type!=='IN'), ins=s.items.filter(m=>m.type==='IN');
    outs.forEach(m=>no.set(m.id,n++)); ins.forEach(m=>no.set(m.id,n++));
    for(let i=0;i<Math.max(outs.length,ins.length);i++) rows.push({L:ins[i], R:outs[i]});
    prev=s.dt;
  }
  rows.push({blank:true});
  return {rows,no,nIn:list.filter(m=>m.type==='IN').length,nOut:list.filter(m=>m.type!=='IN').length};
}
function buildLate(items){
  const list=items.slice().sort(sortMv); const rows=[]; const slots=[];
  for(const m of list){ const s=slots[slots.length-1]; if(s && s.dt===m.datetime) s.items.push(m); else slots.push({dt:m.datetime, items:[m]}); }
  for(const s of slots){ const outs=s.items.filter(m=>m.type!=='IN'), ins=s.items.filter(m=>m.type==='IN');
    for(let i=0;i<Math.max(outs.length,ins.length);i++) rows.push({L:ins[i], R:outs[i], late:true}); }
  if(!rows.length) rows.push({blank:true});
  return rows;
}
function rColumn(D){
  const out=dutyPilots(D).map(p=>`P.${p}/${S.pilots[p]||''}`); out.push('');
  let g=null; for(const f of S.fixed){ if(g!==null && f.group!==g) out.push(''); out.push(f.text); g=f.group; }
  return out;
}
function berthText(m){ return m.type==='IN'? m.to : m.type==='OUT'? m.from : `${m.from||''}<>${m.to||''}`; }

function sheetHTML(D){
  const main = buildMain(S.mv.filter(m=>inWin(m,D) && !+m.late));
  const late = buildLate(S.mv.filter(m=>inWin(m,addDays(D,-1)) && +m.late));
  const R = rColumn(D);
  while(main.rows.length < R.length) main.rows.splice(main.rows.length-1,0,{blank:true});
  const tot = COLW.reduce((a,b)=>a+b,0);
  let h = `<table class="sheet"><colgroup>${COLW.map(w=>`<col style="width:${(w/tot*100).toFixed(3)}%">`).join('')}</colgroup>`;
  h += `<tr><td class="date" colspan="2" rowspan="2">${longDate(D)}</td><td class="title" colspan="16" rowspan="2">SHIP'S&nbsp;&nbsp; SCHEDULE&nbsp; FOR&nbsp; SONGKHLA&nbsp;&nbsp; PILOT</td></tr><tr></tr>`;
  h += `<tr><td class="h-in" colspan="9">ENTERING</td><td class="h-out" colspan="9">SAILING &amp; SHIFTING</td></tr>`;
  h += `<tr>${['NO.',"SHIP'S&nbsp; NAME",'LOA','Drf','ETA','POB','BERTH','Pilot','AGENT','NO.',"SHIP'S&nbsp; NAME",'LOA','Drf','ETD','BERTH','Pilot','AGENT'].map(t=>`<td class="hd">${t}</td>`).join('')}<td class="r">PILOT ON DUTY</td></tr>`;
  let ri=0;
  const cellsL=(m,lateRow)=> m ? `<td class="${lateRow?'pc':''}">${lateRow?'พ':(main.no.get(m.id)||'')}</td><td class="l">${esc(m.ship)}</td><td>${esc(m.loa)}</td><td>${esc(m.drf)}</td><td>${fmtT(m.datetime)}</td><td>${fmtT(m.pob||m.datetime)}</td><td>${esc(m.to)}</td><td class="pc">${esc(m.pilot)}</td><td>${esc(m.agent)}</td>`
                               : '<td></td>'.repeat(9);
  const cellsR=(m,lateRow)=> m ? `<td class="${lateRow?'pc':''}">${lateRow?'พ':(main.no.get(m.id)||'')}</td><td class="l">${esc(m.ship)}</td><td>${esc(m.loa)}</td><td>${esc(m.drf)}</td><td>${fmtT(m.datetime)}</td><td>${esc(berthText(m))}</td><td class="pc">${esc(m.pilot)}</td><td>${esc(m.agent)}</td>`
                               : '<td></td>'.repeat(8);
  const rcell = () => `<td class="r">${esc(R[ri++]||'')}</td>`;
  for(const row of main.rows) h += `<tr>${cellsL(row.L)}${cellsR(row.R)}${rcell()}</tr>`;
  h += `<tr><td class="late-h" colspan="17">เรือที่แจ้งเข้า - ออกและเลื่อน เพิ่มเติม หลังจากจัดจ่ายงาน วันที่&nbsp; ${longDate(addDays(D,-1))}</td>${rcell()}</tr>`;
  for(const row of late) h += `<tr>${cellsL(row.L,true)}${cellsR(row.R,true)}${rcell()}</tr>`;
  h += `<tr><td class="foot" colspan="18"> SHIP'S  ENTERING   ${main.nIn}  VESSEL SAILING &amp; SHIFTING  ${main.nOut}  VESSEL   E.mail  ${EMAIL} </td></tr></table>`;
  const nRows = 4 + main.rows.length + 1 + late.length + 1;
  return {html:h, main, nRows};
}

/* ---------- rendering ---------- */
function renderAll(){
  const [a,b]=win(S.D);
  $('windowLabel').innerHTML = `รอบ <span class="num">${shortDate(S.D)} ${S.settings.cutoff}</span> – <span class="num">${shortDate(addDays(S.D,1))} ${addTimeLabel()}</span>`;
  const sh = sheetHTML(S.D);
  sh.html = shrinkToFit(sh.html);
  $('paperSmall').innerHTML = sh.html; $('paperBig').innerHTML = sh.html;
  // print copy, shrink to one page if long (A4 landscape ≈ 33 rows at 18pt)
  const fit = Math.min(1, 33/sh.nRows);
  $('printRoot').innerHTML = `<div style="zoom:${fit.toFixed(3)}">${sh.html}</div>`;
  $('printNote').textContent = `A4 แนวนอน · หน้าเดียว · ${sh.nRows} แถว${fit<1?` (ย่อ ${Math.round(fit*100)}%)`:''}`;
  renderList(sh.main); scaleProof();
}
// Excel "shrink to fit": measure at print width (A4 landscape ≈ 1091px) and reduce font where text overflows
function shrinkToFit(html){
  const box=$('measure'); box.innerHTML=html;
  for(const td of box.querySelectorAll('td')){
    if(!td.textContent.trim() || td.scrollWidth<=td.clientWidth+1) continue;
    const base=parseFloat(getComputedStyle(td).fontSize); let k=(td.clientWidth-4)/td.scrollWidth;
    td.style.fontSize=(base*k).toFixed(2)+'px';
    for(let i=0;i<4 && td.scrollWidth>td.clientWidth+1;i++){ k*=0.93; td.style.fontSize=(base*k).toFixed(2)+'px'; }
  }
  const out=box.innerHTML; box.innerHTML=''; return out;
}
function addTimeLabel(){ const [h,m]=S.settings.cutoff.split(':').map(Number); const t=h*60+m-1; return `${pad(Math.floor(t/60))}:${pad(t%60)}`; }

function renderList(main){
  const items = S.mv.filter(m=>inWin(m,S.D)).sort(sortMv);
  const nIn=items.filter(m=>m.type==='IN').length, nOut=items.filter(m=>m.type==='OUT').length, nSh=items.filter(m=>m.type==='SHIFT').length;
  const noPilot=items.filter(m=>!m.pilot).length, nLate=items.filter(m=>+m.late).length;
  $('stats').innerHTML = `<span class="chip c-in">เข้า ${nIn}</span><span class="chip c-out">ออก ${nOut}</span><span class="chip c-shift">ย้ายท่า ${nSh}</span>`+
    (items.length? (noPilot? `<span class="chip c-warn">ยังไม่มีผก. ${noPilot}</span>` : `<span class="chip c-ok">ใส่ผก.ครบ</span>`) : '') +
    (nLate? `<span class="chip c-late">พ ${nLate}</span>`:'');
  if(!items.length){ $('list').innerHTML = `<div class="empty-state">ยังไม่มีเรือในรอบนี้ — กรอกชื่อเรือและเวลาในช่องด้านบน</div>`; }
  else {
    let h='', prev=null;
    for(const m of items){
      if(prev){ const g=(minutes(m.datetime)-minutes(prev))/60; if(g>=S.settings.gap) h+=`<div class="gap">ห่าง ${g%1?g.toFixed(1):g} ชม. · เว้นแถว</div>`; }
      prev=m.datetime; h+=rowHTML(m, +m.late? 'พ' : main.no.get(m.id));
    }
    $('list').innerHTML=h;
  }
  const prevLate = S.mv.filter(m=>inWin(m,addDays(S.D,-1)) && +m.late).sort(sortMv);
  $('lateList').innerHTML = prevLate.length? `<div class="sub">พ จากรอบ ${shortDate(addDays(S.D,-1))} (แสดงท้ายตารางนี้)</div><div class="list">${prevLate.map(m=>rowHTML(m,'พ')).join('')}</div>` : '';
}
function rowHTML(m,no){
  const t = {IN:['เข้า','c-in'],OUT:['ออก','c-out'],SHIFT:['ย้าย','c-shift']}[m.type];
  const pil = dutyPilots(S.D); const opts=['',...pil]; if(m.pilot && !opts.includes(m.pilot)) opts.push(m.pilot);
  return `<div class="row${S.editId===m.id?' sel':''}" data-id="${m.id}">
    <div class="no${no==='พ'?' late':''}">${no??''}</div>
    <div class="t">${fmtT(m.datetime)}</div>
    <div class="tchip ${t[1]}">${t[0]}</div>
    <div class="ship"><b>${esc(m.ship)}</b><span>${esc([m.loa, berthText(m), m.agent].filter(Boolean).join(' · '))}</span></div>
    <select class="${m.pilot?'':'empty'}" data-pilot="${m.id}" aria-label="นำร่อง ${esc(m.ship)}">${opts.map(p=>`<option value="${p}"${p===(m.pilot||'')?' selected':''}>${p||'ผก.?'}</option>`).join('')}</select>
    <div class="ops">${m.type==='IN'?`<button type="button" data-out="${m.id}">+ออก</button>`:''}<button type="button" data-del="${m.id}">ลบ</button></div>
  </div>`;
}
function scaleProof(){
  const w=$('proofSmall').clientWidth; if(!w) return; const s=w/1123; const el=$('proofSmall').firstElementChild;
  el.style.transform=`scale(${s})`; $('proofSmall').style.height=($('paperSmall').offsetHeight*s)+'px';
}
new ResizeObserver(scaleProof).observe($('proofSmall'));

/* ---------- form ---------- */
function setType(t){
  S.type=t; for(const b of $('typeSeg').children) b.setAttribute('aria-pressed', b.dataset.t===t);
  $('lTime').textContent = t==='IN'?'ETA':'ETD';
  $('fPob').parentElement.hidden = t!=='IN';
  $('wFrom').hidden = t==='IN'; $('wTo').hidden = t==='OUT';
  $('wFrom').querySelector('label').textContent = t==='SHIFT'?'จากท่า':'ท่าที่ออก';
  $('wTo').querySelector('label').textContent = t==='SHIFT'?'ไปท่า':'ท่าเข้า';
  autoBerth();
}
function renderPilotBtns(){
  const pil=dutyPilots(S.D); const other = S.pilot && !pil.includes(S.pilot) ? S.pilot : '';
  $('pilotBtns').innerHTML = ['',...pil].map(p=>`<button type="button" data-p="${p}" aria-pressed="${p===S.pilot}">${p||'—'}</button>`).join('') +
    `<input id="fPilotOther" class="num" placeholder="อื่น" value="${esc(other)}" aria-label="เลขผก.อื่น">`;
}
function setPilot(p){ S.pilot=p; for(const b of $('pilotBtns').querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.p===p); const o=$('fPilotOther'); if(o && o.value!==p && p && !dutyPilots(S.D).includes(p)) o.value=p; else if(o && (dutyPilots(S.D).includes(p)||!p)) o.value=''; }
function lastBerth(ship, dt){
  const prev=S.mv.filter(m=>m.ship===ship && m.datetime<dt && m.id!==S.editId).sort(sortMv).pop();
  if(prev) return prev.type==='OUT'? '' : prev.to;
  return S.shipIdx.get(ship)?.berth || '';
}
function autoBerth(){
  const ship=$('fShip').value.trim().toUpperCase(); if(!ship || S.editId) return;
  const s=S.shipIdx.get(ship); const dt=parseTime($('fTime').value,S.D) || `${S.D} 23:59`;
  if(S.type==='IN' && !$('fTo').value) $('fTo').value = s?.berth || '';
  if(S.type!=='IN' && !$('fFrom').value) $('fFrom').value = lastBerth(ship, dt) || s?.berth || '';
}
function onShip(){
  const name=$('fShip').value.trim().toUpperCase(); const s=S.shipIdx.get(name);
  $('hShip').textContent = !name? '' : s? [s.loa&&`LOA ${s.loa}`, s.berth, s.agent, s.note].filter(Boolean).join(' · ') : 'เรือใหม่ — จะเพิ่มเข้าฐานเรือเมื่อบันทึก';
  if(s && !S.editId){ $('fLoa').value = s.loa||''; $('fAgent').value = s.agent||''; $('fFrom').value=''; $('fTo').value=''; autoBerth(); }
}
function onTime(){
  const v=$('fTime').value; const dt=parseTime(v,S.D); const h=$('hTime');
  if(!v){ h.textContent=''; h.className='hint'; return; }
  if(!dt){ h.textContent='อ่านเวลาไม่ได้ เช่น 0630 หรือ 27-0630'; h.className='hint bad'; return; }
  const sd=schedOf(dt);
  h.textContent = `${fmtT(dt)} · ${shortDate(dt.slice(0,10))}`+(sd!==S.D?` · อยู่รอบ ${shortDate(sd)}`:'');
  h.className = 'hint'+(sd!==S.D?' bad':'');
  if(S.type==='IN' && !S.pobTouched) $('fPob').value='';
}
function clearForm(keepType=true){
  S.editId=null; S.pobTouched=false;
  for(const id of ['fShip','fLoa','fTime','fPob','fDrf','fFrom','fTo','fAgent']) $(id).value='';
  $('fLate').checked=false; $('hShip').textContent=''; $('hTime').textContent='';
  $('formTitle').textContent='เพิ่มเรือ'; $('editBanner').hidden=true; $('delBtn').hidden=true;
  renderPilotBtns(); setPilot(''); if(!keepType) setType('IN'); else setType(S.type);
  document.querySelectorAll('.row.sel').forEach(r=>r.classList.remove('sel'));
}
function loadIntoForm(m){
  clearForm(); S.editId=m.id; setType(m.type);
  $('fShip').value=m.ship; $('fLoa').value=m.loa||''; $('fTime').value=fmtT(m.datetime); $('fDrf').value=m.drf||'';
  $('fPob').value = m.pob && m.pob!==m.datetime ? fmtT(m.pob) : ''; S.pobTouched=!!$('fPob').value;
  $('fFrom').value=m.from||''; $('fTo').value=m.to||''; $('fAgent').value=m.agent||''; $('fLate').checked=!!+m.late;
  renderPilotBtns(); setPilot(m.pilot||''); onTime(); onShip();
  $('formTitle').textContent='แก้ไขเรือ'; $('editBanner').hidden=false; $('editBanner').textContent=`กำลังแก้ไข ${m.ship} ${fmtT(m.datetime)}`; $('delBtn').hidden=false;
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel', r.dataset.id===m.id));
  $('fShip').scrollIntoView({block:'nearest'}); $('fTime').focus();
}
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

async function saveForm(e){
  e.preventDefault();
  const ship=$('fShip').value.trim().toUpperCase().replace(/\s+/g,' ');
  const dt=parseTime($('fTime').value,S.D);
  if(!ship){ $('fShip').focus(); return toast('ใส่ชื่อเรือ'); }
  if(!dt){ $('fTime').focus(); return toast('ใส่เวลา เช่น 0630'); }
  const pobDt = S.type==='IN' && $('fPob').value ? parseTime($('fPob').value,S.D) : null;
  const old = S.editId ? S.mv.find(x=>x.id===S.editId) : null;
  const m = { id:S.editId||newId(), type:S.type, datetime:dt, ship, loa:$('fLoa').value.trim(), drf:$('fDrf').value.trim(),
    pob: S.type==='IN' ? (pobDt||dt) : '', from: S.type==='IN'?'':$('fFrom').value.trim().toUpperCase(),
    to: S.type==='OUT'?'':$('fTo').value.trim().toUpperCase(), pilot:S.pilot, agent:$('fAgent').value.trim().toUpperCase(),
    late: $('fLate').checked?1:0, note: old?.note||'' };
  try{
    if(!S.shipIdx.has(ship)){
      const s={name:ship, loa:m.loa, berth:m.to||m.from, agent:m.agent, note:''};
      await api('saveShip',{},{ship:s}); S.ships.push(s); S.shipIdx.set(ship,s); fillDatalists();
    }
    await api('saveMovement',{},{m});
    const i=S.mv.findIndex(x=>x.id===m.id); if(i>=0) S.mv[i]=m; else S.mv.push(m);
    toast(old?'บันทึกการแก้ไขแล้ว':`เพิ่ม ${ship} แล้ว`);
    clearForm(); renderAll(); $('fShip').focus();
    if(schedOf(dt)!==S.D && !old) toast(`บันทึกแล้ว · อยู่รอบ ${shortDate(schedOf(dt))}`);
  }catch(err){ toast('บันทึกไม่สำเร็จ: '+err.message); }
}
async function quickPilot(id, p){
  const m=S.mv.find(x=>x.id===id); if(!m) return; const m2={...m, pilot:p};
  try{ await api('saveMovement',{},{m:m2}); Object.assign(m,m2); renderAll(); }catch(err){ toast('บันทึกไม่สำเร็จ: '+err.message); renderAll(); }
}
async function del(id){
  try{ await api('deleteMovement',{},{id}); S.mv=S.mv.filter(x=>x.id!==id); if(S.editId===id) clearForm(); renderAll(); toast('ลบแล้ว'); }
  catch(err){ toast('ลบไม่สำเร็จ: '+err.message); }
}
function makeOut(id){
  const m=S.mv.find(x=>x.id===id); clearForm(); setType('OUT');
  $('fShip').value=m.ship; onShip();
  $('fLoa').value=m.loa||''; $('fAgent').value=m.agent||''; $('fFrom').value=m.to||''; $('fTime').focus(); toast(`สร้างเที่ยวออก ${m.ship} · ใส่เวลา`);
}
let toastT; function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

/* ---------- events ---------- */
$('typeSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ if(!S.editId){ $('fFrom').value=''; $('fTo').value=''; } setType(b.dataset.t); } });
$('pilotBtns').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setPilot(b.dataset.p); });
$('pilotBtns').addEventListener('input',e=>{ if(e.target.id==='fPilotOther'){ S.pilot=e.target.value.trim(); for(const b of $('pilotBtns').querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.p===S.pilot && !!S.pilot); } });
$('fShip').addEventListener('change',onShip); $('fShip').addEventListener('input',()=>{ if(S.shipIdx.has($('fShip').value.trim().toUpperCase())) onShip(); else $('hShip').textContent=''; });
$('fTime').addEventListener('input',onTime);
$('fPob').addEventListener('input',()=>S.pobTouched=!!$('fPob').value);
$('mvForm').addEventListener('submit',saveForm);
$('clearBtn').addEventListener('click',()=>clearForm());
let delArm=null;
$('delBtn').addEventListener('click',()=>{ if(delArm!==S.editId){ delArm=S.editId; $('delBtn').textContent='กดอีกครั้งเพื่อลบ'; setTimeout(()=>{delArm=null;$('delBtn').textContent='ลบ';},3000); } else { delArm=null; $('delBtn').textContent='ลบ'; del(S.editId); } });
function listClick(e){
  const out=e.target.closest('[data-out]'); if(out){ makeOut(out.dataset.out); return; }
  const d=e.target.closest('[data-del]'); if(d){ if(d.classList.contains('confirm')) del(d.dataset.del); else { d.classList.add('confirm'); d.textContent='ยืนยัน'; setTimeout(()=>{ if(d.isConnected){ d.classList.remove('confirm'); d.textContent='ลบ'; } },3000); } return; }
  if(e.target.closest('select')) return;
  const r=e.target.closest('.row'); if(r) loadIntoForm(S.mv.find(x=>x.id===r.dataset.id));
}
$('list').addEventListener('click',listClick); $('lateList').addEventListener('click',listClick);
document.addEventListener('change',e=>{ const s=e.target.closest('select[data-pilot]'); if(s) quickPilot(s.dataset.pilot, s.value); });
async function goDate(D){ S.D=D; $('schedDate').value=D; clearForm(); try{ await loadMovements(); }catch(err){ toast('โหลดข้อมูลไม่สำเร็จ: '+err.message); } renderAll(); }
$('schedDate').addEventListener('change',e=>{ if(e.target.value) goDate(e.target.value); });
$('prevDay').addEventListener('click',()=>goDate(addDays(S.D,-1)));
$('nextDay').addEventListener('click',()=>goDate(addDays(S.D,1)));
function showTab(t){ for(const x of ['work','print']){ $('tab-'+x).setAttribute('aria-selected', x===t); $('view-'+x).hidden = x!==t; } $('view-setup').hidden = t!=='setup'; if(t==='work') scaleProof(); }
$('modeBadge').addEventListener('click',()=>{ if(!SEED || CFG.API_URL){ $('sUrl').value=CFG.API_URL; $('sKey').value=CFG.TOKEN; showTab('setup'); } });
$('sBack').addEventListener('click',()=>showTab('work'));
$('setupForm').addEventListener('submit',async e=>{ e.preventDefault();
  const url=$('sUrl').value.trim(), key=$('sKey').value.trim(); const msg=$('sMsg');
  if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)){ msg.textContent='URL ต้องเป็น Web app ของ Apps Script ลงท้าย /exec'; msg.className='hint bad'; return; }
  msg.textContent='กำลังทดสอบ…'; msg.className='hint';
  const old={...CFG}; CFG.API_URL=url; CFG.TOKEN=key;
  try{ const d=await api('init'); try{ localStorage.setItem(CFG_KEY, JSON.stringify({url,key})); }catch(x){}
    msg.textContent=`เชื่อมต่อแล้ว · เรือ ${d.ships.length} ลำ`; location.reload(); }
  catch(err){ Object.assign(CFG,old); msg.textContent='เชื่อมต่อไม่ได้: '+err.message; msg.className='hint bad'; } });
$('sOff').addEventListener('click',()=>{ try{ localStorage.setItem(CFG_KEY, JSON.stringify({})); }catch(e){} location.reload(); });
$('tab-work').addEventListener('click',()=>showTab('work')); $('tab-print').addEventListener('click',()=>showTab('print'));
const framed = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
if(framed && !window.__CAN_PRINT__){ $('printBtn').hidden=true; $('printNote').textContent='ตัวอย่าง: ปุ่มปริ้นใช้ได้เมื่อเปิดจากเว็บของคุณ'; }
$('printBtn').addEventListener('click',()=>window.print());

(async function start(){
  $('modeBadge').textContent = CFG.API_URL? 'เชื่อม Google Sheet' : 'โหมดตัวอย่าง';
  $('modeBadge').classList.toggle('live', !!CFG.API_URL);
  if(!CFG.API_URL && !SEED){ $('modeBadge').textContent='ยังไม่เชื่อมต่อ'; $('tab-work').disabled=true; $('tab-print').disabled=true; $('sBack').hidden=true; $('sOff').hidden=true; showTab('setup'); return; }
  try{ await loadInit(); }catch(err){ toast('โหลดฐานข้อมูลไม่สำเร็จ: '+err.message); $('sUrl').value=CFG.API_URL; $('sKey').value=CFG.TOKEN; $('sMsg').textContent='โหลดไม่สำเร็จ: '+err.message; $('sMsg').className='hint bad'; showTab('setup'); return; }
  const D = (!CFG.API_URL && SEED && SEED.startDate) ? SEED.startDate : todayYmd();
  setType('IN'); try{ await document.fonts.ready; }catch(e){} await goDate(D);
})();
</script>

</body>
