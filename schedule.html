<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songkhla Ship Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: the schedule workbook as an editable grid — ENTERING on the left, SAILING & SHIFTING on the right, exactly like the Excel tab */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#13212E; --muted:#5A6B7B; --line:#D3DDE5; --grid:#C9D3DC;
  --accent:#0B5C9E; --accent-ink:#FFFFFF; --accent-soft:#E2EEF8; --focus:#3B8FD6;
  --in:#D9F6FB; --in-ink:#0B6475; --out:#FFE4C8; --out-ink:#8A4B10; --shift:#EDE6FF; --shift-ink:#55399A;
  --late:#FFD6F5; --late-ink:#9B1C7A; --warn:#FFF1C9; --warn-ink:#7A5600; --pilot:#D0021B; --ok:#E3F5E8; --ok-ink:#1F6B3A;
  --head:#EAEAEA; --newrow:#F6FAFD; --sep:#F1F4F7;
  --paper:#FFFFFF; --paper-ink:#000000;
  --f-ui:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-sheet:"Book Antiqua","Palatino Linotype",Palatino,"TH Sarabun New","Tahoma",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D151C; --surface:#15212B; --ink:#E6EEF4; --muted:#93A5B4; --line:#2A3A47; --grid:#2F404E;
  --accent:#5BA8E8; --accent-ink:#06121C; --accent-soft:#18324A; --focus:#7CC0F5;
  --in:#123A44; --in-ink:#9FE3F2; --out:#45301A; --out-ink:#FFCB94; --shift:#2E2650; --shift-ink:#CDBDFF;
  --late:#4A1A3E; --late-ink:#FFB0E8; --warn:#3D3210; --warn-ink:#FFDC7A; --pilot:#FF6B6B; --ok:#173726; --ok-ink:#9BE3B4;
  --head:#22313D; --newrow:#13202A; --sep:#111C24;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D151C; --surface:#15212B; --ink:#E6EEF4; --muted:#93A5B4; --line:#2A3A47; --grid:#2F404E;
  --accent:#5BA8E8; --accent-ink:#06121C; --accent-soft:#18324A; --focus:#7CC0F5;
  --in:#123A44; --in-ink:#9FE3F2; --out:#45301A; --out-ink:#FFCB94; --shift:#2E2650; --shift-ink:#CDBDFF;
  --late:#4A1A3E; --late-ink:#FFB0E8; --warn:#3D3210; --warn-ink:#FFDC7A; --pilot:#FF6B6B; --ok:#173726; --ok-ink:#9BE3B4;
  --head:#22313D; --newrow:#13202A; --sep:#111C24;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-ui);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font-weight:700;font-size:19px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:500;color:var(--muted);font-size:14px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav input{font-size:18px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:18px}
.window{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.mode{font-size:13px;padding:3px 8px;border-radius:99px;background:var(--warn);color:var(--warn-ink);font-weight:600;border:0;cursor:pointer}
.mode.live{background:var(--ok);color:var(--ok-ink)}

main{padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{margin:0 0 12px;font-size:16px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.btn{border:1px solid var(--line);background:var(--bg);padding:10px 18px;border-radius:9px;font-weight:600;cursor:pointer;font-size:17px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--pilot)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted)}
.scrollx{overflow-x:auto}

/* setup form */
.setup{max-width:760px;display:grid;gap:12px}.setup p{margin:0}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:14px;color:var(--muted);font-weight:500}
.f input{width:100%;font-size:18px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.f .hint{font-size:13px;color:var(--muted);min-height:1.2em}
.f .hint.bad{color:var(--pilot)}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}

/* summary bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:15px;font-weight:600}
.c-in{background:var(--in);color:var(--in-ink)}.c-out{background:var(--out);color:var(--out-ink)}.c-shift{background:var(--shift);color:var(--shift-ink)}
.c-late{background:var(--late);color:var(--late-ink)}.c-warn{background:var(--warn);color:var(--warn-ink)}.c-ok{background:var(--ok);color:var(--ok-ink)}
/* ship register */
.shipbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.shipbar input{flex:1 1 320px;max-width:520px;font-size:18px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.shipadd{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-bottom:12px}
.shipadd input{min-width:0;font-size:17px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:center}
.shipadd input#nsName{text-align:left}
@media (max-width:640px){.shipadd{grid-template-columns:1fr 1fr}.shipadd #nsName{grid-column:1/-1}}
table.st{border-collapse:collapse;table-layout:fixed;width:100%;font-size:17px}
.st th,.st td{border:1px solid var(--grid);padding:8px 10px;text-align:center}
.st thead th{position:sticky;top:0;background:var(--head);font-size:15px}
.st td{padding:0}.st td.num,.st td.empty{padding:8px 10px}
.st input{width:100%;min-height:40px;border:0;background:transparent;text-align:center;font:500 17px var(--f-ui);color:var(--ink);padding:0 10px}
.st input.nm{text-align:left;font-weight:600}.st input.nt{font-size:15px;color:var(--muted)}.st input.num{font-family:var(--f-num)}
.st input:focus{outline:2px solid var(--focus);outline-offset:-2px;background:var(--accent-soft)}
.st input.saved{background:var(--ok)}
.st button.del{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px;color:var(--pilot)}
.st button.del.arm{background:var(--pilot);color:#fff;border-color:var(--pilot)}
.st td.empty{color:var(--muted);padding:24px}
.st tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--head) 35%,transparent)}

/* ---------- editable grid (same columns as the Excel tab) ---------- */
.gridwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* the work grid is drawn as the printed sheet: white paper, Book Antiqua, the sheet's own fills */
.sheetwrap{overflow-x:auto;background:#fff;border:1px solid #9aa4ad;box-shadow:0 1px 3px rgb(0 0 0 / .12)}
table.eg{border-collapse:collapse;table-layout:fixed;width:100%;min-width:1180px;font-family:var(--f-sheet);font-size:16px;color:#000;background:#fff}
.eg th,.eg td{border:1px solid #8a8a8a;padding:0;height:34px;text-align:center;vertical-align:middle;color:#000}
.eg thead th{background:#EAEAEA;font-weight:700;font-size:14px}
.eg thead tr.ttl th{height:46px;background:#fff}
.eg thead tr.ttl th.date{background:#FFFF99;font-size:24px}
.eg thead tr.ttl th.title{font-size:19px;letter-spacing:.06em;word-spacing:.3em}
.eg thead tr.band th{height:28px;font-size:14px}
.eg thead tr.cols th{height:28px;font-size:13px}
.eg th.b-in{background:#CCFFFF}
.eg th.b-out{background:#FFCC99}
.eg input{width:100%;height:100%;min-height:33px;border:0;background:transparent;text-align:center;padding:0 4px;font:400 16px var(--f-sheet);color:#000;border-radius:0}
.eg input.ship{text-align:left}
.eg td.shipc:focus-within input.ship{padding-right:100px}
.eg input:focus{outline:2px solid #3B8FD6;outline-offset:-2px;background:#E8F2FB}
.eg input.pil{color:#FF0000;font-weight:700}
.eg td.need{background:#FFF7D6}
.eg input.bad{background:#FFE1E1;outline:2px solid #D0021B;outline-offset:-2px}
.eg tbody tr:hover td{background:#F4F8FB}
.eg tbody tr:hover td.need{background:#FFF7D6}
.eg td.no{font-size:15px}
.eg td.no button{width:100%;height:100%;min-height:33px;border:0;background:transparent;font:inherit;color:inherit;cursor:pointer}
.eg td.no button:hover{background:#FFCCFF}
.eg td.no.lt,.eg td.no.lt button{color:#FF0000;font-weight:700}
.eg td.shipc{position:relative;text-align:left}
.eg .ops{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:none;gap:3px}
.eg td.shipc:hover .ops,.eg td.shipc:focus-within .ops{display:flex}
.eg .ops button{border:1px solid #b5bec6;background:#fff;color:#13212E;border-radius:6px;font-size:12px;padding:3px 6px;cursor:pointer;white-space:nowrap;font-family:var(--f-ui)}
.eg .ops button.arm{background:#D0021B;color:#fff;border-color:#D0021B}
.eg tr.sep td{height:34px}
.eg tr.lateh td{background:#FFCCFF;font-weight:700;font-size:16px;height:32px}
.eg tr.foot td{background:#FFFF99;font-weight:700;font-size:15px;height:32px;white-space:pre}
.eg .kind{font-size:11px;font-weight:700;border-radius:4px;padding:1px 4px;margin-left:4px;font-family:var(--f-ui)}

/* combo popup (type to filter) */
.combo-pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .18);max-height:300px;max-width:min(520px,calc(100vw - 16px));overflow-y:auto;padding:4px}
.combo-pop .opt{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:7px 10px;border-radius:6px;cursor:pointer;font:600 16px var(--f-num);white-space:nowrap}
.combo-pop .opt small{color:var(--muted);font:400 13px var(--f-ui)}
.combo-pop .opt.act,.combo-pop .opt:hover{background:var(--accent-soft)}
.combo-pop .opt mark{background:none;color:var(--accent);font-weight:700}

/* print preview tab */
.paper{background:var(--paper);color:var(--paper-ink);width:1123px;padding:16px}
.printbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}

/* ---------- the printed sheet (kept identical to the Excel tab) ---------- */
table.sheet{border-collapse:collapse;table-layout:fixed;width:100%;font-family:var(--f-sheet);font-size:10pt;color:#000;background:#fff}
.sheet td{border:.5pt solid #555;height:18pt;padding:0 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:clip;line-height:1}
.sheet .l{text-align:left}
.sheet .date{font-size:22pt;font-weight:700;background:#FFFF99}
.sheet .title{font-size:14pt;font-weight:700}
.sheet .h-in{background:#CCFFFF;font-weight:700}
.sheet .h-out{background:#FFCC99;font-weight:700}
.sheet .hd{background:#EAEAEA;font-weight:700}
.sheet .pc{color:#FF0000;font-weight:700}
.sheet .r{background:#CCFFCC;font-weight:700;font-size:7pt}
.sheet .late-h{background:#FFCCFF;font-weight:700;font-size:11pt}
.sheet .foot{background:#FFFF99;font-weight:700;white-space:pre}
#printRoot{display:none}
#measure{position:absolute;left:-99999px;top:0;width:1091px;visibility:hidden}
@page{size:A4 landscape;margin:4.3mm}
@media print{
  body{background:#fff}
  body::before,.top,main,.toast,.combo-pop{display:none!important}
  #printRoot{display:block}
  #printRoot table.sheet{width:100%}
}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:80;max-width:calc(100vw - 32px)}
</style>
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<header class="top">
  <div class="brand">ตารางเรือ <small>SONGKHLA PILOT</small></div>
  <div class="datenav">
    <button class="iconbtn" id="prevDay" aria-label="วันก่อนหน้า">‹</button>
    <input type="date" id="schedDate" aria-label="ตารางวันที่">
    <button class="iconbtn" id="nextDay" aria-label="วันถัดไป">›</button>
  </div>
  <div class="window" id="windowLabel"></div>
  <button type="button" class="mode" id="modeBadge" title="ตั้งค่าการเชื่อมต่อ"></button>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-work" aria-selected="true">จัดตาราง</button>
    <button role="tab" id="tab-print" aria-selected="false">หน้าปริ้น</button>
    <button role="tab" id="tab-ships" aria-selected="false">ทะเบียนเรือ</button>
    <button role="tab" id="tab-line" aria-selected="false" disabled title="ขั้นที่ 3">รูป LINE</button>
  </nav>
</header>

<main>
  <section id="view-work">
    <div class="sheetwrap"><table class="eg" id="grid"></table></div>
  </section>

  <section id="view-setup" hidden>
    <div class="panel setup">
      <h2>เชื่อมต่อ Google Sheet ตารางเรือ</h2>
      <p class="note">ใช้ชีต <b>ShipSchedule_DB</b> + สคริปต์ <b>apps_script/Schedule.gs</b> (คนละชีตกับบันทึกเรือ) ขั้นตอนติดตั้งอยู่ใน README หัวข้อ เมนู 🗓 จัดตารางเรือ</p>
      <form id="setupForm" class="fgrid" autocomplete="off">
        <div class="f span4"><label for="sUrl">Web app URL (ลงท้าย /exec)</label><input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec"></div>
        <div class="f span2"><label for="sKey">รหัส (ตามบรรทัด KEYS ในสคริปต์)</label><input id="sKey"></div>
        <div class="f span2" style="align-content:end"><button type="submit" class="btn primary" id="sTest">ทดสอบและเชื่อมต่อ</button></div>
        <div class="f span4"><div class="hint" id="sMsg"></div></div>
      </form>
      <div class="actions"><button type="button" class="btn" id="sBack">กลับไปจัดตาราง</button><button type="button" class="btn danger" id="sOff">ยกเลิกการเชื่อมต่อในเครื่องนี้</button></div>
    </div>
  </section>

  <section id="view-ships" hidden>
    <div class="shipbar">
      <input id="shipQ" type="search" placeholder="ค้นหา ชื่อเรือ / ท่า / เอเย่นต์" autocomplete="off" aria-label="ค้นหาเรือ">
      <span class="chip c-in" id="shipCount"></span>
    </div>
    <form id="shipAdd" class="shipadd" autocomplete="off">
      <input id="nsName" placeholder="ชื่อเรือใหม่" aria-label="ชื่อเรือ">
      <input id="nsLoa" placeholder="LOA" inputmode="numeric" aria-label="LOA">
      <input id="nsBerth" placeholder="ท่าประจำ" aria-label="ท่าประจำ">
      <input id="nsAgent" placeholder="เอเย่นต์" aria-label="เอเย่นต์">
      <button type="submit" class="btn primary">เพิ่มเรือ</button>
    </form>
    <div class="gridwrap"><table class="st"><colgroup><col style="width:5%"><col style="width:29%"><col style="width:9%"><col style="width:15%"><col style="width:15%"><col style="width:19%"><col style="width:8%"></colgroup>
      <thead><tr><th>#</th><th>ชื่อเรือ</th><th>LOA</th><th>ท่าประจำ</th><th>เอเย่นต์</th><th>หมายเหตุ</th><th></th></tr></thead><tbody id="shipBody"></tbody></table></div>
  </section>

  <section id="view-print" hidden>
    <div class="printbar">
      <button class="btn primary" id="printBtn">ปริ้น</button>
      <span class="note" id="printNote">A4 แนวนอน · หน้าเดียว</span>
    </div>
    <div class="scrollx"><div class="paper" id="paperBig"></div></div>
  </section>
</main>

<div id="printRoot"></div><div id="measure" aria-hidden="true"></div>
<div class="combo-pop" id="pop" role="listbox" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* การเชื่อมต่อ: จาก Streamlit secrets [schedule] (window.__SCHED__) หรือที่กรอกในหน้า ตั้งค่า (เก็บในเครื่องนี้) */
const CFG_KEY='shipsched_cfg';
const CFG = (()=>{ const c={API_URL:'',TOKEN:''}; const inj=window.__SCHED__||{};
  if(inj.url){ c.API_URL=inj.url; c.TOKEN=inj.key||''; }
  try{ const v=JSON.parse(localStorage.getItem(CFG_KEY)||'null'); if(v&&v.url){ c.API_URL=v.url; c.TOKEN=v.key||''; } }catch(e){}
  return c; })();
if(window.__THEME__) document.documentElement.dataset.theme = window.__THEME__;
const SEED = /*SEED*/null;

const MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const COLW = [3.86,20.29,3.86,3.86,8,8,8,3.86,6.71,3.71,21.43,4.14,4.14,8.14,18,3.86,7.14,7.43]; // Excel column widths A..R
const EMAIL = 'songkhlapilot@hotmail.com';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S = { ships:[], shipIdx:new Map(), berths:[], agents:[], pilots:{}, duty:{}, fixed:[], settings:{cutoff:'17:00', gap:2}, mv:[], D:'' };

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
function todayYmd(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(ymd,n){ const [y,m,d]=ymd.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,d+n)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`; }
function longDate(ymd){ const [y,m,d]=ymd.split('-').map(Number); return `${d} ${MONTHS[m-1]} ${y}`; }
function shortDate(ymd){ const [y,m,d]=ymd.split('-').map(Number); return `${d}/${m}`; }
function cutHM(){ return S.settings.cutoff.replace(':',''); }
function win(D){ return [`${D} ${S.settings.cutoff}`, `${addDays(D,1)} ${S.settings.cutoff}`]; }
function inWin(m,D){ const [a,b]=win(D); return m.datetime>=a && m.datetime<b; }
function schedOf(dt){ const d=dt.slice(0,10), hm=dt.slice(11).replace(':',''); return hm>=cutHM()? d : addDays(d,-1); }
function fmtT(dt){ if(!dt) return ''; return `${+dt.slice(8,10)}-${dt.slice(11,13)}${dt.slice(14,16)}`; }
function minutes(dt){ const [d,t]=dt.split(' '); const [y,m,dd]=d.split('-').map(Number); const [h,mi]=t.split(':').map(Number); return Date.UTC(y,m-1,dd,h,mi)/60000; }
function parseTime(txt, D){
  txt=(txt||'').trim().replace(/[.:]/g,''); let m, date, hm;
  if((m=txt.match(/^(\d{3,4})$/))){ hm=m[1].padStart(4,'0'); date = hm>=cutHM()? D : addDays(D,1); }
  else if((m=txt.match(/^(\d{1,2})\s*[-\/ ]\s*(\d{3,4})$/))){ hm=m[2].padStart(4,'0'); const day=+m[1];
    for(const off of [0,1,-1,2,-2,3]){ const c=addDays(D,off); if(+c.slice(8)===day){ date=c; break; } } }
  if(!date) return null;
  const h=+hm.slice(0,2), mi=+hm.slice(2); if(h>23||mi>59) return null;
  return `${date} ${pad(h)}:${pad(mi)}`;
}

/* ---------- data layer ---------- */
const LS_KEY='shipsched-demo-v2';
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){ return null; } }
function lsSet(v){ try{ localStorage.setItem(LS_KEY, JSON.stringify(v)); }catch(e){} }
const demo = {
  db:null,
  boot(){ const saved=lsGet(); this.db = saved && saved.v===2 ? saved : {v:2, mv:SEED.movements.slice(), ships:SEED.init.ships.slice()}; },
  persist(){ lsSet(this.db); },
};
async function api(action, params={}, body=null){
  if(!CFG.API_URL){
    if(!SEED) throw new Error('ยังไม่ได้ตั้งค่า API_URL');
    if(!demo.db) demo.boot();
    if(action==='init') return {...SEED.init, ships:demo.db.ships.slice()};
    if(action==='movements') return demo.db.mv.filter(m=>m.datetime>=params.from && m.datetime<params.to);
    if(action==='saveMovement'){ const i=demo.db.mv.findIndex(x=>x.id===body.m.id); if(i>=0) demo.db.mv[i]=body.m; else demo.db.mv.push(body.m); demo.persist(); return body.m; }
    if(action==='deleteMovement'){ demo.db.mv=demo.db.mv.filter(x=>x.id!==body.id); demo.persist(); return true; }
    if(action==='saveShip'){ if(!demo.db.ships.some(x=>x.name===body.ship.name)) demo.db.ships.push(body.ship); demo.persist(); return body.ship; }
    if(action==='updateShip'){ const i=demo.db.ships.findIndex(x=>x.name===body.oldName);
      if(body.ship.name!==body.oldName && demo.db.ships.some(x=>x.name===body.ship.name)) throw new Error(body.ship.name+' มีในทะเบียนแล้ว');
      if(i>=0) demo.db.ships[i]=body.ship; else demo.db.ships.push(body.ship); demo.persist(); return body.ship; }
    if(action==='deleteShip'){ demo.db.ships=demo.db.ships.filter(x=>x.name!==body.name); demo.persist(); return true; }
  }
  let r;
  if(body){ r = await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:CFG.TOKEN,action,...body})}); }
  else { r = await fetch(CFG.API_URL+'?'+new URLSearchParams({action,token:CFG.TOKEN,...params})); }
  const j = await r.json(); if(!j.ok) throw new Error(j.error||'ผิดพลาด'); return j.data;
}

/* ---------- layout engine (matches the Excel sheet rules) ---------- */
const order = m => m.type==='IN' ? 1 : 0;   // same minute: sailing/shifting numbered before entering
function sortMv(a,b){ return a.datetime<b.datetime?-1:a.datetime>b.datetime?1:order(a)-order(b); }
function buildMain(items){
  const list=items.slice().sort(sortMv); const rows=[{blank:true}]; const no=new Map(); let n=1, prev=null;
  const slots=[]; for(const m of list){ const s=slots[slots.length-1]; if(s && s.dt===m.datetime) s.items.push(m); else slots.push({dt:m.datetime, items:[m]}); }
  for(const s of slots){
    if(prev && (minutes(s.dt)-minutes(prev))/60 >= S.settings.gap) rows.push({blank:true, gapH:(minutes(s.dt)-minutes(prev))/60});
    const outs=s.items.filter(m=>m.type!=='IN'), ins=s.items.filter(m=>m.type==='IN');
    outs.forEach(m=>no.set(m.id,n++)); ins.forEach(m=>no.set(m.id,n++));
    for(let i=0;i<Math.max(outs.length,ins.length);i++) rows.push({L:ins[i], R:outs[i]});
    prev=s.dt;
  }
  rows.push({blank:true});
  return {rows,no,nIn:list.filter(m=>m.type==='IN').length,nOut:list.filter(m=>m.type!=='IN').length};
}
function buildLate(items){
  const list=items.slice().sort(sortMv); const rows=[]; const slots=[];
  for(const m of list){ const s=slots[slots.length-1]; if(s && s.dt===m.datetime) s.items.push(m); else slots.push({dt:m.datetime, items:[m]}); }
  for(const s of slots){ const outs=s.items.filter(m=>m.type!=='IN'), ins=s.items.filter(m=>m.type==='IN');
    for(let i=0;i<Math.max(outs.length,ins.length);i++) rows.push({L:ins[i], R:outs[i], late:true}); }
  if(!rows.length) rows.push({blank:true});
  return rows;
}
function rColumn(D){
  const out=dutyPilots(D).map(p=>`P.${p}/${S.pilots[p]||''}`); out.push('');
  let g=null; for(const f of S.fixed){ if(g!==null && f.group!==g) out.push(''); out.push(f.text); g=f.group; }
  return out;
}
function berthText(m){ return m.type==='IN'? m.to : m.type==='OUT'? m.from : `${m.from||''}<>${m.to||''}`; }

// Excel "shrink to fit": measure at print width (A4 landscape ≈ 1091px) and reduce font where text overflows
function shrinkToFit(html){
  const box=$('measure'); box.innerHTML=html;
  for(const td of box.querySelectorAll('td')){
    if(!td.textContent.trim() || td.scrollWidth<=td.clientWidth+1) continue;
    const base=parseFloat(getComputedStyle(td).fontSize); let k=(td.clientWidth-4)/td.scrollWidth;
    td.style.fontSize=(base*k).toFixed(2)+'px';
    for(let i=0;i<4 && td.scrollWidth>td.clientWidth+1;i++){ k*=0.93; td.style.fontSize=(base*k).toFixed(2)+'px'; }
  }
  const out=box.innerHTML; box.innerHTML=''; return out;
}

function inputHTML(key,f,side,val,extra=''){

function halfHTML(side, m, o){

      const need = f==='pilot' && !m.pilot ? ' need' : '';
      const cell = inputHTML(m.id,f,side,fieldVal(m,f,side),`data-base="${o.base}"`);
      if(f==='ship') h+=`<td class="shipc">${cell}<span class="ops">${side==='L'?`<button type="button" data-act="out" data-id="${m.id}" title="สร้างเที่ยวออกของเรือลำนี้">+ออก</button>`:''}<button type="button" data-act="del" data-id="${m.id}">ลบ</button></span></td>`;
      else h+=`<td class="${need.trim()}">${cell}</td>`;
    }
  } else if(o.draft){
    for(const f of F){
      if(f==='no'){ h+=`<td class="no${mid}">${o.isNew?'＋':''}</td>`; continue; }
      const cell = inputHTML(o.draft,f,side,'',`data-draft="${o.draft}" data-base="${o.base}" data-def="${o.def||''}" data-late="${o.late?1:0}"${o.isNew?' data-new="1"':''}`);

    }

    h += `<td class="dis${mid}" colspan="${F.length}"></td>`;
  }
  return h;
}

// shrink long text to fit its cell, like Excel's shrink-to-fit
function fitInput(i){ i.style.fontSize=''; if(!i.value || i.offsetParent===null) return; const base=parseFloat(getComputedStyle(i).fontSize);
  if(i.scrollWidth>i.clientWidth+1){ const k=(i.clientWidth-2)/i.scrollWidth; i.style.fontSize=Math.max(10,base*k).toFixed(1)+'px'; } }

// re-render after an edit but keep the cursor where the user is typing
let rrT=null, focusWant=null;
function rerender(want){
  if(want) focusWant=want;
  clearTimeout(rrT);
  rrT=setTimeout(()=>{
    const a=document.activeElement; const k = focusWant || (a && a.dataset && a.dataset.k) || null;
    const sel = a && a.dataset && a.dataset.k===k && typeof a.selectionStart==='number' ? [a.selectionStart,a.selectionEnd] : null;
    focusWant=null; hidePop();
    renderAll();
    if(k){ const el=document.querySelector(`#grid [data-k="${CSS.escape(k)}"]`); if(el){ el.focus({preventScroll:false}); if(sel) try{ el.setSelectionRange(...sel); }catch(e){} } }
  },0);
}

/* ---------- edits ---------- */
function parseBerthR(txt){
  const v=norm(txt).replace(/\s*(<>|<->|->|>|→)\s*/g,'<>');
  if(v.includes('<>')){ const [a,...b]=v.split('<>'); return {type:'SHIFT', from:a.trim(), to:b.join('<>').trim()}; }
  return {type:'OUT', from:v, to:''};
}
function lastBerth(ship, dt, exceptId){
  const prev=S.mv.filter(m=>m.ship===ship && m.datetime<dt && m.id!==exceptId).sort(sortMv).pop();
  if(prev) return prev.type==='OUT'? '' : prev.to;
  return S.shipIdx.get(ship)?.berth || '';
}
async function persist(m){
  try{ await api('saveMovement',{},{m}); }catch(err){ toast('บันทึกไม่สำเร็จ: '+err.message); }
}
async function ensureShip(m){
  if(!m.ship || S.shipIdx.has(m.ship)) return;
  const s={name:m.ship, loa:m.loa, berth:m.type==='IN'?m.to:(m.from||m.to), agent:m.agent, note:''};
  S.ships.push(s); S.shipIdx.set(m.ship,s);
  try{ await api('saveShip',{},{ship:s}); toast(`เพิ่ม ${m.ship} เข้าทะเบียนเรือแล้ว`); }catch(err){ toast('เพิ่มเรือใหม่ไม่สำเร็จ: '+err.message); }
}
function onCellChange(inp){
  if(inp.dataset.draft) return draftFill(inp);
  const [id,f]=inp.dataset.k.split(':'); const m=S.mv.find(x=>x.id===id); if(!m) return;
  const v=inp.value.trim(), side=inp.dataset.side, base=inp.dataset.base;
  inp.classList.remove('bad');
  if(f==='ship'){ if(!v){ inp.value=m.ship; return toast('ลบเรือ ใช้ปุ่ม ลบ ในช่องชื่อเรือ'); }
    m.ship=norm(v); const s=S.shipIdx.get(m.ship); if(s){ if(s.loa) m.loa=s.loa; if(s.agent) m.agent=s.agent; } ensureShip(m); }
  else if(f==='t'){ const dt=parseTime(v,base); if(!dt){ inp.classList.add('bad'); return toast('อ่านเวลาไม่ได้ พิมพ์ 0630 หรือ 27-0630'); }
    if(m.type==='IN' && (!m.pob || m.pob===m.datetime)) m.pob=dt; m.datetime=dt;
    const sd=schedOf(dt); if(sd!==base) toast(`เวลา ${fmtT(dt)} อยู่รอบ ${shortDate(sd)} — ย้ายไปตารางนั้นแล้ว`); }
  else if(f==='pob'){ if(!v){ m.pob=m.datetime; } else { const dt=parseTime(v,base); if(!dt){ inp.classList.add('bad'); return toast('อ่านเวลา POB ไม่ได้'); } m.pob=dt; } }
  else if(f==='berth'){ if(side==='L') m.to=norm(v); else { const b=parseBerthR(v); m.type=b.type; m.from=b.from; m.to=b.to; } }
  else if(f==='agent') m.agent=norm(v);
  else if(f==='pilot') m.pilot=v.replace(/^P\.?/i,'').trim();
  else m[f]=v;
  persist(m); rerender();
}
// draft rows: picking a known ship fills the rest of the row
function draftFill(inp){
  if(inp.dataset.f!=='ship') return;
  const name=norm(inp.value); const s=S.shipIdx.get(name); if(!s) return;
  inp.value=name;
  const p=inp.dataset.draft, side=inp.dataset.side, q=f=>document.querySelector(`#grid [data-k="${p}:${f}"]`);
  if(!q('loa').value) q('loa').value=s.loa||'';
  if(!q('agent').value) q('agent').value=s.agent||'';
  if(!q('berth').value){ q('berth').value = side==='L' ? (s.berth||'') : (lastBerth(name, inp.dataset.def || `${S.D} 23:59`) || s.berth || ''); }
}
async function commitDraft(p, fromBlur){
  const q=f=>document.querySelector(`#grid [data-k="${p}:${f}"]`); const sh=q('ship'); if(!sh) return false;
  const ship=norm(sh.value); if(!ship) return false;
  const side=sh.dataset.side, base=sh.dataset.base, def=sh.dataset.def, late=sh.dataset.late==='1';
  const tv=q('t').value.trim(); const dt = tv ? parseTime(tv,base) : def;
  if(!dt){ q('t').classList.add('bad'); if(!fromBlur) q('t').focus(); toast(tv?'อ่านเวลาไม่ได้ พิมพ์ 0630 หรือ 27-0630':'ใส่เวลา เช่น 0630'); return false; }
  const s=S.shipIdx.get(ship)||{};
  const m={ id:newId(), datetime:dt, ship, loa:q('loa').value.trim()||s.loa||'', drf:q('drf').value.trim(),
    pilot:q('pilot').value.replace(/^P\.?/i,'').trim(), agent:norm(q('agent').value)||s.agent||'', late:late?1:0, note:'' };
  if(side==='L'){ m.type='IN'; m.to=norm(q('berth').value)||s.berth||''; m.from='';
    const pv=q('pob').value.trim(); m.pob = pv ? (parseTime(pv,base)||dt) : dt; }
  else { const b=parseBerthR(q('berth').value||lastBerth(ship,dt)||s.berth||''); m.type=b.type; m.from=b.from; m.to=b.to; m.pob=''; }
  S.mv.push(m); ensureShip(m); persist(m);
  const sd=schedOf(dt); if(!late && sd!==S.D) toast(`บันทึกแล้ว · เวลา ${fmtT(dt)} อยู่ตารางวันที่ ${shortDate(sd)}`);
  const wantNew = late ? (side==='L'?'lateL':'lateR') : (side==='L'?'newL':'newR');
  rerender(`${wantNew}:ship`);
  return true;
}
async function delMv(id){
  const m=S.mv.find(x=>x.id===id); if(!m) return;
  S.mv=S.mv.filter(x=>x.id!==id); rerender();
  try{ await api('deleteMovement',{},{id}); toast(`ลบ ${m.ship} ${fmtT(m.datetime)} แล้ว`); }catch(err){ toast('ลบไม่สำเร็จ: '+err.message); }
}
function toggleLate(id){
  const m=S.mv.find(x=>x.id===id); if(!m) return; m.late=+m.late?0:1; persist(m); rerender();
  const sd=schedOf(m.datetime);
  toast(+m.late? `${m.ship} เป็น พ → อยู่ท้ายตารางวันที่ ${shortDate(addDays(sd,1))}` : `${m.ship} กลับเข้าตารางวันที่ ${shortDate(sd)}`);
}
function makeOut(id){
  const m=S.mv.find(x=>x.id===id); if(!m) return; const p='newR', q=f=>document.querySelector(`#grid [data-k="${p}:${f}"]`);
  q('ship').value=m.ship; q('loa').value=m.loa||''; q('agent').value=m.agent||''; q('berth').value=m.to||''; q('drf').value=''; q('t').value=''; q('pilot').value='';
  q('t').focus(); toast(`เที่ยวออก ${m.ship} · ใส่เวลา ETD แล้วกด Enter`);
}

/* ---------- combo popup (type to filter, like ทะเบียนเรือ in บันทึกเรือ) ---------- */
const pop=$('pop'); const cb={inp:null,items:[],act:-1};
function optsFor(inp){
  const f=inp.dataset.f;
  if(f==='ship') return S.ships.map(s=>({v:s.name, meta:[s.loa&&`LOA ${s.loa}`, s.berth, s.agent].filter(Boolean).join(' · ')}));
  if(f==='berth') return S.berths.map(v=>({v}));
  if(f==='agent') return S.agents.map(v=>({v}));
  if(f==='pilot'){ const d=dutyPilots(S.D); const all=[...d, ...Object.keys(S.pilots).filter(p=>!d.includes(p))];
    return all.map(p=>({v:p, meta:(d.includes(p)?'เวรเดือนนี้ · ':'')+(S.pilots[p]||'')})); }
  return null;
}
function hidePop(){ pop.hidden=true; cb.inp=null; }
function buildPop(inp){
  const all=optsFor(inp); if(!all){ hidePop(); return; }
  cb.inp=inp;
  let q=norm(inp.value); const f=inp.dataset.f;
  if(f==='berth' && inp.dataset.side==='R' && q.includes('<>')) q=q.split('<>').pop().trim();
  let list=all;
  if(q){ const a=[],b=[]; for(const x of all){ const k=norm(x.v); if(k.startsWith(q)) a.push(x); else if(k.includes(q)) b.push(x); } list=a.concat(b); }
  cb.items=list.slice(0,80); cb.act=q&&cb.items.length?0:-1;
  if(!cb.items.length || (cb.items.length===1 && norm(cb.items[0].v)===q)){ pop.hidden=true; return; }
  pop.innerHTML = cb.items.map((x,i)=>{ const k=norm(x.v), at=q?k.indexOf(q):-1;
    const lab = at>=0 ? esc(x.v.slice(0,at))+'<mark>'+esc(x.v.slice(at,at+q.length))+'</mark>'+esc(x.v.slice(at+q.length)) : esc(x.v);
    return `<div class="opt${i===cb.act?' act':''}" role="option" data-i="${i}"><span>${lab}</span>${x.meta?`<small>${esc(x.meta)}</small>`:''}</div>`; }).join('');
  const r=inp.getBoundingClientRect(), W=window.innerWidth, H=window.innerHeight;
  pop.style.minWidth=Math.min(Math.max(r.width,f==='ship'?380:120),W-16)+'px';
  pop.style.left=Math.max(8,Math.min(r.left,W-Math.min(520,W-16)-8))+'px';
  const below=H-r.bottom;
  if(below<200 && r.top>below){ pop.style.top=''; pop.style.bottom=(H-r.top+2)+'px'; } else { pop.style.bottom=''; pop.style.top=(r.bottom+2)+'px'; }
  pop.hidden=false;
}
function pick(i){
  const x=cb.items[i], inp=cb.inp; if(!x||!inp) return;
  if(inp.dataset.f==='berth' && inp.dataset.side==='R' && inp.value.includes('<>')) inp.value = inp.value.split('<>')[0].trim()+'<>'+x.v;
  else inp.value=x.v;
  hidePop(); inp.dispatchEvent(new Event('change',{bubbles:true}));
}
pop.addEventListener('mousedown',e=>{ const o=e.target.closest('.opt'); if(o){ e.preventDefault(); pick(+o.dataset.i); } });
document.addEventListener('scroll',e=>{ if(e.target!==pop && !pop.hidden) hidePop(); },true);
window.addEventListener('resize',hidePop);

/* ---------- grid events ---------- */
const G=$('grid');
G.addEventListener('focusin',e=>{ const i=e.target.closest('input'); if(i){ i.select(); buildPop(i); } });
G.addEventListener('input',e=>{ const i=e.target.closest('input'); if(i){ i.classList.remove('bad'); fitInput(i); buildPop(i); } });
G.addEventListener('change',e=>{ const i=e.target.closest('input'); if(i) onCellChange(i); });
G.addEventListener('focusout',e=>{
  const i=e.target.closest('input'); if(!i) return;
  setTimeout(()=>{ if(cb.inp===i && document.activeElement!==i) hidePop(); },120);
  const p=i.dataset.draft; if(!p) return;
  const to=e.relatedTarget; if(to && to.dataset && to.dataset.draft===p) return;   // still inside the same new row
  if(to && to.closest && to.closest('#pop')) return;
  setTimeout(()=>{ const a=document.activeElement; if(a && a.dataset && a.dataset.draft===p) return; commitDraft(p, true); },0);
});
function moveV(inp,d){
  const list=[...G.querySelectorAll(`input[data-f="${inp.dataset.f}"][data-side="${inp.dataset.side}"]`)];
  const n=list[list.indexOf(inp)+d]; if(n){ n.focus(); }
}
G.addEventListener('keydown',e=>{
  const i=e.target.closest('input'); if(!i) return;
  const open=!pop.hidden && cb.inp===i;
  if(open && (e.key==='ArrowDown'||e.key==='ArrowUp')){ e.preventDefault(); const n=cb.items.length; cb.act=(cb.act+(e.key==='ArrowDown'?1:-1)+n)%n;
    [...pop.children].forEach((c,k)=>c.classList.toggle('act',k===cb.act)); pop.children[cb.act]?.scrollIntoView({block:'nearest'}); return; }
  if(open && (e.key==='Enter'||e.key==='Tab') && cb.act>=0 && i.value.trim()){ if(e.key==='Enter') e.preventDefault(); pick(cb.act); if(e.key==='Enter' && i.dataset.draft) return; if(e.key==='Enter') return; }
  if(e.key==='Escape'){ hidePop(); return; }
  if(e.key==='Enter'){ e.preventDefault();
    if(i.dataset.draft){ i.dispatchEvent(new Event('change',{bubbles:true})); commitDraft(i.dataset.draft); return; }
    i.blur(); setTimeout(()=>{ const el=G.querySelector(`[data-k="${CSS.escape(i.dataset.k)}"]`); if(el) moveV(el,1); },20); return; }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); moveV(i, e.key==='ArrowDown'?1:-1); }
});
G.addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]'); if(!b) return; const id=b.dataset.id;
  if(b.dataset.act==='late') toggleLate(id);
  else if(b.dataset.act==='out') makeOut(id);
  else if(b.dataset.act==='del'){ if(b.classList.contains('arm')) delMv(id); else { b.classList.add('arm'); b.textContent='ยืนยันลบ'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('arm'); b.textContent='ลบ'; } },3000); } }
});

/* ---------- navigation / tabs / setup ---------- */
async function goDate(D){ S.D=D; $('schedDate').value=D; hidePop(); try{ await loadMovements(); }catch(err){ toast('โหลดข้อมูลไม่สำเร็จ: '+err.message); } renderAll(); }
$('schedDate').addEventListener('change',e=>{ if(e.target.value) goDate(e.target.value); });
$('prevDay').addEventListener('click',()=>goDate(addDays(S.D,-1)));
$('nextDay').addEventListener('click',()=>goDate(addDays(S.D,1)));
function showTab(t){ for(const x of ['work','print','ships']){ $('tab-'+x).setAttribute('aria-selected', x===t); $('view-'+x).hidden = x!==t; } if(t==='work') $('grid').querySelectorAll('input').forEach(fitInput); $('view-setup').hidden = t!=='setup'; hidePop(); }
$('tab-work').addEventListener('click',()=>showTab('work')); $('tab-print').addEventListener('click',()=>showTab('print'));
$('tab-ships').addEventListener('click',()=>{ renderShips(); showTab('ships'); });

/* ---------- ทะเบียนเรือ ---------- */
function lastSeen(name){ const l=S.mv.filter(m=>m.ship===name).sort(sortMv).pop(); return l? fmtT(l.datetime)+' '+shortDate(l.datetime.slice(0,10)).split('/')[1].padStart(2,'0') : ''; }
function renderShips(){
  const q=norm($('shipQ').value);
  const list=S.ships.filter(s=>!q || norm(s.name).includes(q) || norm(s.agent).includes(q) || norm(s.berth).includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  $('shipCount').textContent = q? `${list.length} / ${S.ships.length} ลำ` : `${S.ships.length} ลำ`;
  const cell=(s,f,cls='')=>`<td><input class="${cls}" data-ship="${esc(s.name)}" data-sf="${f}" value="${esc(s[f])}" autocomplete="off" spellcheck="false" aria-label="${f} ${esc(s.name)}"></td>`;
  $('shipBody').innerHTML = list.map((s,i)=>`<tr><td class="num">${i+1}</td>${cell(s,'name','nm')}${cell(s,'loa','num')}${cell(s,'berth')}${cell(s,'agent')}${cell(s,'note','nt')}<td><button type="button" class="del" data-delship="${esc(s.name)}">ลบ</button></td></tr>`).join('')
    || `<tr><td colspan="7" class="empty">ไม่พบเรือ</td></tr>`;
  $('tab-ships').textContent=`ทะเบียนเรือ (${S.ships.length})`;
}
function scriptOld(err){ return /ไม่รู้จักคำสั่ง/.test(err.message) ? 'ต้องอัปเดตสคริปต์ Schedule.gs ก่อน (Deploy › Manage deployments › New version)' : err.message; }
$('shipBody').addEventListener('change',async e=>{
  const inp=e.target.closest('input[data-sf]'); if(!inp) return;
  const old=inp.dataset.ship, f=inp.dataset.sf, s=S.shipIdx.get(old); if(!s) return;
  let v=inp.value.trim(); if(f!=='note' && f!=='loa') v=norm(v);
  if(f==='name'){ if(!v){ inp.value=old; return; } if(v!==old && S.shipIdx.has(v)){ inp.value=old; return toast(`${v} มีในทะเบียนแล้ว`); } }
  const ns={...s,[f]:v};
  try{ await api('updateShip',{},{oldName:old, ship:ns});
    Object.assign(s,ns); if(f==='name'){ S.shipIdx.delete(old); S.shipIdx.set(v,s); inp.dataset.ship=v; inp.closest('tr').querySelectorAll('[data-ship]').forEach(x=>x.dataset.ship=v); inp.closest('tr').querySelector('[data-delship]').dataset.delship=v; }
    inp.value=v; inp.classList.add('saved'); setTimeout(()=>inp.classList.remove('saved'),900); }
  catch(err){ inp.value=s[f]||''; toast('แก้ไม่สำเร็จ: '+scriptOld(err)); }
});
$('shipBody').addEventListener('keydown',e=>{ const i=e.target.closest('input[data-sf]'); if(!i) return;
  if(e.key==='Enter'||e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); const col=[...$('shipBody').querySelectorAll(`input[data-sf="${i.dataset.sf}"]`)]; const n=col[col.indexOf(i)+(e.key==='ArrowUp'?-1:1)]; if(n) n.focus(); else i.blur(); } });
$('shipBody').addEventListener('focusin',e=>{ const i=e.target.closest('input'); if(i) i.select(); });
$('shipBody').addEventListener('click',async e=>{ const b=e.target.closest('[data-delship]'); if(!b) return;
  if(!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent='ยืนยันลบ'; setTimeout(()=>{ if(b.isConnected){ b.classList.remove('arm'); b.textContent='ลบ'; } },3000); return; }
  const name=b.dataset.delship;
  try{ await api('deleteShip',{},{name}); S.ships=S.ships.filter(x=>x.name!==name); S.shipIdx.delete(name); renderShips(); toast(`ลบ ${name} ออกจากทะเบียนแล้ว`); }
  catch(err){ toast('ลบไม่สำเร็จ: '+scriptOld(err)); } });
$('shipQ').addEventListener('input',renderShips);
$('shipAdd').addEventListener('submit',async e=>{ e.preventDefault();
  const name=norm($('nsName').value); if(!name){ $('nsName').focus(); return; }
  if(S.shipIdx.has(name)){ toast(`${name} มีในทะเบียนแล้ว`); $('shipQ').value=name; renderShips(); return; }
  const s={name, loa:$('nsLoa').value.trim(), berth:norm($('nsBerth').value), agent:norm($('nsAgent').value), note:''};
  try{ await api('saveShip',{},{ship:s}); S.ships.push(s); S.shipIdx.set(name,s); ['nsName','nsLoa','nsBerth','nsAgent'].forEach(id=>$(id).value=''); $('shipQ').value=''; renderShips(); toast(`เพิ่ม ${name} แล้ว`); $('nsName').focus(); }
  catch(err){ toast('เพิ่มไม่สำเร็จ: '+err.message); } });
$('modeBadge').addEventListener('click',()=>{ if(!SEED || CFG.API_URL){ $('sUrl').value=CFG.API_URL; $('sKey').value=CFG.TOKEN; showTab('setup'); } });
$('sBack').addEventListener('click',()=>showTab('work'));
$('setupForm').addEventListener('submit',async e=>{ e.preventDefault();
  const url=$('sUrl').value.trim(), key=$('sKey').value.trim(); const msg=$('sMsg');
  if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)){ msg.textContent='URL ต้องเป็น Web app ของ Apps Script ลงท้าย /exec'; msg.className='hint bad'; return; }
  msg.textContent='กำลังทดสอบ…'; msg.className='hint';
  const old={...CFG}; CFG.API_URL=url; CFG.TOKEN=key;
  try{ const d=await api('init'); try{ localStorage.setItem(CFG_KEY, JSON.stringify({url,key})); }catch(x){}
    msg.textContent=`เชื่อมต่อแล้ว · เรือ ${d.ships.length} ลำ`; location.reload(); }
  catch(err){ Object.assign(CFG,old); msg.textContent='เชื่อมต่อไม่ได้: '+err.message; msg.className='hint bad'; } });
$('sOff').addEventListener('click',()=>{ try{ localStorage.setItem(CFG_KEY, JSON.stringify({})); }catch(e){} location.reload(); });
const framed = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
if(framed && !window.__CAN_PRINT__){ $('printBtn').hidden=true; $('printNote').textContent='ตัวอย่าง: ปุ่มปริ้นใช้ได้เมื่อเปิดจากเว็บของคุณ'; }
$('printBtn').addEventListener('click',()=>window.print());

(async function start(){
  $('modeBadge').textContent = CFG.API_URL? 'เชื่อม Google Sheet' : 'โหมดตัวอย่าง';
  $('modeBadge').classList.toggle('live', !!CFG.API_URL);
  if(!CFG.API_URL && !SEED){ $('modeBadge').textContent='ยังไม่เชื่อมต่อ'; $('tab-work').disabled=true; $('tab-print').disabled=true; $('tab-ships').disabled=true; $('sBack').hidden=true; $('sOff').hidden=true; showTab('setup'); return; }
  try{ await loadInit(); }catch(err){ toast('โหลดฐานข้อมูลไม่สำเร็จ: '+err.message); $('sUrl').value=CFG.API_URL; $('sKey').value=CFG.TOKEN; $('sMsg').textContent='โหลดไม่สำเร็จ: '+err.message; $('sMsg').className='hint bad'; showTab('setup'); return; }
  const D = (!CFG.API_URL && SEED && SEED.startDate) ? SEED.startDate : todayYmd();
  try{ await document.fonts.ready; }catch(e){}
  await goDate(D); renderShips();
})();
</script>
