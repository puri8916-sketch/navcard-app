<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
  // Hands this browser's remembered sign-in (localStorage "navauth") to Python in the same session: no page reload.
  function post(type, extra) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), '*'); }
  let t = '';
  try { t = localStorage.getItem('navauth') || ''; } catch (e) {}
  let sent = false;
  function send() { if (sent) return; sent = true; post('streamlit:setComponentValue', { value: { t: t }, dataType: 'json' }); }
  window.addEventListener('message', function (e) { if (e.data && e.data.type === 'streamlit:render') send(); });
  post('streamlit:componentReady', { apiVersion: 1 });
  post('streamlit:setFrameHeight', { height: 0 });
  setTimeout(send, 50);
</script>
</body>
</html>
